spring:
  application:
    name: lifecore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifecore}
    username: ${DB_USERNAME:lifecore}
    password: ${DB_PASSWORD:lifecore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

lifecore:
  documents:
    bucket: ${DOCUMENTS_BUCKET:lifecore-documents}
    presigned-url-ttl: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-stacktrace: never
