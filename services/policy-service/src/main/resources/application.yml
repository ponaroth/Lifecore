spring:
  application:
    name: policy-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/policy}
    username: ${DB_USERNAME:lifecore}
    password: ${DB_PASSWORD:lifecore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8081}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for Kubernetes
