# Local development.
#   docker compose up -d                  -> PostgreSQL + LocalStack only (run services from your IDE)
#   docker compose --profile apps up -d   -> everything, including the three services
x-service: &service
  profiles: [apps]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    localstack: { condition: service_healthy }
  environment: &service-env
    DB_USERNAME: lifecore
    DB_PASSWORD: lifecore
    PORT: "8080"
    SPRING_CLOUD_AWS_ENDPOINT: http://localstack:4566

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifecore
      POSTGRES_PASSWORD: lifecore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecore -d audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emulates S3, SNS and SQS so the services run without an AWS account.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/lifecore-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  policy-service:
    <<: *service
    build: { context: ./services, args: { SERVICE: policy-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/policy
    ports: ["8081:8080"]

  document-service:
    <<: *service
    build: { context: ./services, args: { SERVICE: document-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/document
    ports: ["8082:8080"]

  audit-service:
    <<: *service
    build: { context: ./services, args: { SERVICE: audit-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/audit
    ports: ["8083:8080"]

volumes:
  postgres-data:
