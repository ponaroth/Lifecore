# Local development dependencies. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifecore
      POSTGRES_USER: lifecore
      POSTGRES_PASSWORD: lifecore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecore -d lifecore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emulates AWS S3 locally so document uploads work without an AWS account.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket lifecore-documents"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
